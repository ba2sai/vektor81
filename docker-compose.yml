# =====================================================================
# DOCKER COMPOSE — VEKTOR81 v2: HYBRID ON-PREMISE COLLECTOR + CLOUDFLARE TUNNEL
# =====================================================================
# Diseñado para arquitectura híbrida Ley 81 / DE 285 (Panamá):
#   - Datos PII crudos se procesan y permanecen dentro de la LAN del cliente.
#   - Solo métricas enmascaradas y hashes SHA-256 salen vía cloudflared (outbound-only)
#     hacia el Control Plane en Cloudflare Workers.
#
# Ejecución estándar (sin túnel):
#   docker compose up -d --build
#
# Ejecución con Cloudflare Zero Trust Tunnel habilitado:
#   docker compose --profile tunnel up -d --build
# =====================================================================

services:
  onprem-collector:
    build:
      context: .
      dockerfile: onprem-collector/Dockerfile
    container_name: vektor81-onprem-collector
    restart: unless-stopped
    environment:
      - VEKTOR81_ENV=${VEKTOR81_ENV:-production}
      - ONPREM_API_TOKEN=${ONPREM_API_TOKEN:-}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost,http://localhost:5173}
      - ENABLE_DEMO_TOOLS=${ENABLE_DEMO_TOOLS:-false}
      - DATABASE_URL=${DATABASE_URL:-sqlite:///./data/vektor81_collector.db}
      - TENANT_ID=${TENANT_ID:-default-tenant}
      - REGULATORY_PROFILE=${REGULATORY_PROFILE:-ANTAI_LEY81}
      - COLLECTOR_ID=${COLLECTOR_ID:-collector-01}
      - CONTROL_PLANE_URL=${CONTROL_PLANE_URL:-}
      - COLLECTOR_TOKEN=${COLLECTOR_TOKEN:-}
      - CLOUDFLARED_METRICS_URL=${CLOUDFLARED_METRICS_URL:-http://cloudflared:2000/ready}
      - ADGUARD_URL=${ADGUARD_URL:-http://adguard:3000}
      - ADGUARD_USER=${ADGUARD_USER:-admin}
      - ADGUARD_PASS=${ADGUARD_PASS:-}
      - WAZUH_API_URL=${WAZUH_API_URL:-}
      - WAZUH_API_USER=${WAZUH_API_USER:-}
      - WAZUH_API_PASS=${WAZUH_API_PASS:-}
      - WAZUH_VERIFY_TLS=${WAZUH_VERIFY_TLS:-true}
    volumes:
      - vektor81_sqlite_data:/app/data
      - ./agents:/app/agents:ro
    expose:
      - "8000"
    mem_reservation: 512m
    mem_limit: 2g
    cpus: 2.0
    networks:
      vektor81_lan:
        aliases:
          - backend

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vektor81-frontend
    restart: unless-stopped
    environment:
      - CONTROL_PLANE_UPSTREAM=${CONTROL_PLANE_URL:-http://control-plane:8787}
    ports:
      - "80:80"
    depends_on:
      - onprem-collector
    mem_reservation: 64m
    mem_limit: 256m
    cpus: 0.5
    networks:
      - vektor81_lan

  # Servicio DNS local AdGuard Home para interceptar y registrar consultas a dominios de IA
  adguard:
    image: adguard/adguardhome:v0.107.52
    container_name: vektor81-adguard
    restart: unless-stopped
    ports:
      - "53:53/tcp"
      - "53:53/udp"
      - "3000:3000/tcp"
    volumes:
      - vektor81_adguard_work:/opt/adguardhome/work
      - vektor81_adguard_conf:/opt/adguardhome/conf
    mem_reservation: 256m
    mem_limit: 1g
    cpus: 1.0
    networks:
      - vektor81_lan

  # Túnel saliente Zero Trust (Cloudflare Tunnel) — activar con: --profile tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: vektor81-cloudflared
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --metrics 0.0.0.0:2000 run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN:-}
    expose:
      - "2000"
    depends_on:
      - onprem-collector
    mem_reservation: 64m
    mem_limit: 256m
    cpus: 0.5
    networks:
      - vektor81_lan

volumes:
  vektor81_sqlite_data:
  vektor81_adguard_work:
  vektor81_adguard_conf:

networks:
  vektor81_lan:
    driver: bridge
