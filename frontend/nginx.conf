server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión gzip para activos estáticos del Dashboard
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;

    # Reverse Proxy de /api/v2 hacia Control Plane Cloudflare Workers / local dev
    # Configurable vía variable de entorno CONTROL_PLANE_UPSTREAM en el contenedor
    location /api/v2/ {
        proxy_pass http://control-plane:8787/api/v2/;
        proxy_http_version 1.1;
        proxy_ssl_server_name on;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
    }

    # Reverse Proxy de /api/v1 hacia el Colector On-Premise (http://onprem-collector:8000)
    location /api/v1/ {
        proxy_pass http://onprem-collector:8000/api/v1/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 15s;
    }

    # Soporte SPA React
    location / {
        try_files $uri $uri/ /index.html;
    }
}
